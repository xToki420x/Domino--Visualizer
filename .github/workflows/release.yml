name: Release

# Push a version tag to cut a release:
#   npm version patch && git push --follow-tags
#
# The workflow builds Windows and Linux packages, verifies each packaged binary
# actually runs, and attaches them all to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand, which is useful for checking a build without tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The virtual camera is a C++ Node addon plus a Media Foundation media
      # source DLL. Both are shipped inside the installer, so they have to be
      # built before packaging rather than left to the user.
      - name: Build native modules
        run: npm run build:native

      - name: Unit tests
        run: npm test

      # Covers the shared-memory channel and drives the media source DLL with a
      # real source reader. Needs no administrator rights, so it runs here.
      - name: Virtual camera tests
        run: npm run test:native

      - name: Build
        run: npm run build

      # Boots the real app and checks every bundled visual compiles and
      # renders. The runner has no audio endpoint, so the loopback assertions
      # are skipped there; they are a hard gate on a real machine.
      - name: Smoke test
        run: npm run test:smoke
        env:
          DOMINO_SMOKE_NO_AUDIO: '1'

      - name: Package
        run: npx electron-builder --win --publish never

      # The packaging step changes how the bundled library is located, so the
      # shipped binary is verified separately from the dev build.
      - name: Verify packaged build
        run: |
          $out = & ".\release\win-unpacked\Domino.exe" --selftest 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'SELFTEST PASSED') { exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: domino-windows
          path: |
            release/Domino-Setup-*.exe
            release/Domino-*-portable.exe


  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # There is nothing to compile here - the virtual camera is Media
      # Foundation and Win32 throughout - but this must still succeed, because
      # a gyp file that fails on Linux would break `npm install` for every
      # Linux contributor.
      # Skips, and must exit 0: the virtual camera is Windows-only, and a
      # build script that fails here would break every Linux contributor.
      - name: Native modules (skipped on Linux)
        run: npm run build:native

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # No display on the runner, and Electron needs one. xvfb gives it a
      # virtual framebuffer; the GL work still runs, on SwiftShader.
      - name: Smoke test
        run: xvfb-run --auto-servernum npm run test:smoke
        env:
          DOMINO_SMOKE_NO_AUDIO: '1'

      - name: Package
        run: npx electron-builder --linux --publish never

      # Same reasoning as the Windows job: packaging changes where the bundled
      # library is found, so the shipped binary is verified, not the dev build.
      - name: Verify packaged build
        run: |
          chmod +x release/*.AppImage
          out=$(xvfb-run --auto-servernum ./release/*.AppImage --appimage-extract-and-run --selftest 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'SELFTEST PASSED'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: domino-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman

  # One job publishes, after both builds are in.
  #
  # Previously each build attached its own assets to the same Release and they
  # raced to create it. Collecting the artifacts and publishing once removes
  # the race entirely, and means a release is never created at all unless both
  # platforms actually built.
  release:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Collect built packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what will be published
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            **Windows.** Run `Domino-Setup-*.exe` to install, or take the
            portable build and run it from anywhere.

            **Linux.** `.AppImage` runs anywhere, `.deb` for Debian and Ubuntu,
            `.pacman` for Arch.

            Publishing Domino as a webcam is Windows-only, and needs a one-time
            driver registration: open **Display → Virtual Camera → Register
            camera driver** and approve the Windows prompt.
          files: artifacts/**/*
